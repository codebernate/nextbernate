version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      nextjs:
        patterns: [next, eslint-config-next]
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom"]
      minor-patch:
        patterns: ["*"]
        exclude-patterns:
          [
            next,
            eslint-config-next,
            react,
            react-dom,
            "@types/react",
            "@types/react-dom",
          ]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
